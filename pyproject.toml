[build-system]
requires = [
    "nanobind>=2.9",
    "scikit-build-core>=1.0",
]
build-backend = "scikit_build_core.build"

[project]
name = "mlx-spatial"
version = "0.0.3"
description = "MLX-native 3D and spatial inference for Apple silicon: object reconstruction, image-to-mesh, scene geometry, Gaussian splats, and multi-view bundles."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "AppAutomaton" }]
keywords = [
    "mlx",
    "apple-silicon",
    "3d-reconstruction",
    "image-to-3d",
    "gaussian-splatting",
    "mesh-generation",
    "photogrammetry",
    "point-cloud",
    "glb",
    "on-device-ai",
]
urls = { Homepage = "https://appautomaton.renocrypt.com/mlx-spatial/", Repository = "https://github.com/appautomaton/mlx-spatial", Documentation = "https://github.com/appautomaton/mlx-spatial/blob/main/docs/architecture.md", Issues = "https://github.com/appautomaton/mlx-spatial/issues" }
requires-python = ">=3.13,<3.14"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Operating System :: MacOS",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "fast-simplification>=0.1.13",
    "mlx>=0.32.0,<0.33",
    "numpy",
    "pillow>=12.2.0",
    "pyyaml>=6.0",
    "safetensors",
    "scipy>=1.17.1",
    "xatlas==0.0.11",
]

[dependency-groups]
dev = [
    "huggingface-hub>=0.36",
    "plyfile>=1.1",
    "pt-safe-loader>=0.1.4",
    "pytest>=8",
]
torch-ref = [
    "einops; python_version == '3.13'",
    "hydra-core; python_version == '3.13'",
    "opencv-python-headless==4.10.0.84; python_version == '3.13'",
    "pillow-heif; python_version == '3.13'",
    "torch; python_version == '3.13'",
    "torchvision; python_version == '3.13'",
    "uniception==0.1.7; python_version == '3.13'",
]
torch-build = [
    "ninja>=1.13; python_version == '3.13'",
    "packaging>=25; python_version == '3.13'",
    "setuptools<82; python_version == '3.13'",
    "wheel>=0.45; python_version == '3.13'",
]

[tool.uv]
environments = [
    "python_version == '3.13' and sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.scripts]
mlx-spatial-trellis2 = "mlx_spatial.trellis2:main"
mlx-spatial-hyworld2 = "mlx_spatial.hyworld2:main"
mlx-spatial-sam3d = "mlx_spatial.sam3d:main"
mlx-spatial-lito = "mlx_spatial.lito:main"
mlx-spatial-mapanything = "mlx_spatial.mapanything:main"
mlx-spatial-pixal3d = "mlx_spatial.pixal3d:main"

[tool.scikit-build]
minimum-version = "1.0"

[tool.scikit-build.cmake.define]
CMAKE_OSX_DEPLOYMENT_TARGET = "14.0"

[tool.scikit-build.wheel]
packages = ["src/mlx_spatial"]

[tool.scikit-build.sdist]
inclusion-mode = "explicit"
include = [
    "/.github",
    "/CMakeLists.txt",
    "/LICENSE",
    "/README.md",
    "/docs",
    "/native/**",
    "/pyproject.toml",
    "/scripts",
    "/src",
    "/tests",
    "/uv.lock",
]
exclude = [
    "/.agent",
    "/.antigravitycli",
    "/.claude",
    "/.codex",
    "/.opencode",
    "/.pytest_cache",
    "/.ruff_cache",
    "/.venv",
    "/build",
    "/dist",
    "/inputs",
    "/outputs",
    "/packages",
    "/vendors",
    "/weights",
    "/**/*.egg-info",
    "/**/.DS_Store",
    "**/__pycache__/",
    "**/*.pyc",
    "**/*.pyo",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not heavy' -p no:cacheprovider"
markers = [
    "heavy: opt-in tests that load real weights, require Metal, or use large tensors",
    "torch_parity: optional parity checks against the local PyTorch checkout",
]
